<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#C99A25"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Performance Free · KPI</title>
<style>
:root{color-scheme:light;--bg:#f7f7f5;--surface:#fff;--surface2:#f4edde;--text:#252525;--muted:#746d5f;--line:#e6dece;--accent:#c99a25;--darkgold:#8c6619;--green:#277851;--bad:#a83b35;--shadow:0 8px 30px #54411b0e}
*{box-sizing:border-box}html{scroll-behavior:smooth}html,body,button,a,input,select,textarea,summary,label{touch-action:manipulation}
body{margin:0;background:radial-gradient(800px 400px at 70% -100px,#efe1c5,transparent),var(--bg);color:var(--text);font:15px/1.48 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;padding:20px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 24px}.brand{display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;background:var(--accent);border-radius:13px;width:42px;height:42px;font-size:21px;font-weight:900}.brand b{font-size:16px;letter-spacing:1px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.1px}.tag{background:var(--surface2);color:var(--darkgold);border-radius:99px;padding:4px 10px;font-size:10px;font-weight:800;letter-spacing:.4px}.topact{display:flex;align-items:center;gap:7px}.btn{background:var(--surface);border:1px solid var(--line);border-radius:11px;min-height:40px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--text)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#211c10}.btn.danger{color:var(--bad)}.btn:disabled{opacity:.4;cursor:default}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:26px}.nav{display:grid;align-content:start;gap:6px}.nav button{border:0;text-align:left;padding:13px;border-radius:11px;color:var(--muted);background:transparent;font-weight:650}.nav button.active{background:var(--surface2);color:var(--darkgold)}.sideinfo{margin-top:15px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;font-size:12px;color:var(--muted)}.content{min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px}.pagehead small{display:block;color:var(--darkgold);font-weight:800;letter-spacing:1.2px;font-size:10px}.pagehead h1{margin:4px 0 0;font-size:clamp(24px,4vw,34px);line-height:1.2;letter-spacing:-1px}.card{border:1px solid var(--line);background:var(--surface);border-radius:17px;padding:16px;box-shadow:var(--shadow)}.grid{display:grid;gap:12px}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.metric small{display:block;color:var(--muted);font-size:11px;font-weight:700}.metric strong{display:block;font-size:clamp(18px,3vw,26px);letter-spacing:-.8px;margin-top:10px;overflow-wrap:anywhere}.metric em{font-style:normal;color:var(--green);font-size:11px}.hero{background:linear-gradient(135deg,#755716,#a7822b 68%,#c99a25);color:#fff;padding:18px;border-radius:18px;margin-bottom:12px}.hero small{font-weight:750;color:#f6e6be;font-size:11px}.hero strong{display:block;font-size:clamp(29px,5vw,42px);margin:5px 0}.hero .tiny{font-size:11px;color:#f6e6be}.progress{background:#ede7dc;border-radius:99px;height:8px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#a47718,#dfbd69)}.hero .progress{background:#ffffff49}.hero .progress i{background:#f8eac3}.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 9px}.section h2{font-size:16px;margin:0}.section span{color:var(--muted);font-size:11px}.half{grid-template-columns:repeat(2,minmax(0,1fr))}.line{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:10px 0;border-bottom:1px solid var(--line)}.line:last-child{border:0}.line span{color:var(--muted)}.line b{font-variant-numeric:tabular-nums;text-align:right}.greeting .header{display:flex;align-items:center;gap:10px}.avatar{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;background:#f5e7bd;font-size:21px;color:var(--darkgold)}.greeting .header small{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1px}.greeting .header strong{font-size:17px}.greeting .meta{display:flex;gap:7px 14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:11px;font-size:12px}.greeting .meta span{color:var(--muted)}.greeting p{font-size:12px;color:var(--muted);margin:8px 0 0}.field{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:650}.field input,.field select,.search{width:100%;border:1px solid var(--line);background:#fffdf8;color:var(--text);border-radius:10px;min-height:42px;padding:9px 11px;min-width:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.formactions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.notice{font-size:12px;color:var(--muted);background:var(--surface2);padding:12px 13px;border-radius:11px;border:1px solid var(--line);margin:12px 0}.record{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:8px 0;overflow:hidden}.record summary{list-style:none;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;cursor:pointer}.record summary::-webkit-details-marker{display:none}.record summary .name{font-size:14px;font-weight:760;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}.record summary .subtitle{font-size:11px;color:var(--muted);display:block}.record summary .money{font-weight:800;color:var(--darkgold);white-space:nowrap;text-align:right}.record summary .chev{font-size:20px;color:var(--muted)}.record[open] summary{background:#fbf5e8}.record[open] summary .chev{transform:rotate(180deg)}.record .inner{border-top:1px solid var(--line);padding:12px;display:grid;gap:11px}.record .inner .buttons{display:flex;justify-content:flex-end;gap:8px}.records{max-width:100%}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.filterbar{display:flex;gap:8px;align-items:center}.filterbar .search{flex:1}.filterbar select{max-width:150px;min-height:42px;padding:9px;border:1px solid var(--line);background:white;border-radius:10px}.pills{display:flex;gap:7px;flex-wrap:wrap}.statpill{border-radius:99px;background:#e7f4e9;color:#24734b;padding:3px 9px;font-size:10px;font-weight:750}.statpill.pending{background:#faeedc;color:#986516}.muted{color:var(--muted)}.mobile-nav{display:none}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#27241b;color:#fff;border-radius:99px;padding:11px 18px;z-index:20;font-size:12px;font-weight:650;max-width:90vw;text-align:center}.hidden{display:none!important}
@media(max-width:850px){.wrap{padding:14px 13px 100px}.layout{display:block}.nav{display:none}.top{margin-bottom:19px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:11;justify-content:space-around;align-items:center;background:#ffffffef;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 7px calc(8px + env(safe-area-inset-bottom))}.mobile-nav button{display:grid;gap:1px;justify-items:center;min-width:64px;border:0;background:transparent;color:var(--muted);font-size:10px;padding:6px 4px;border-radius:8px}.mobile-nav button.active{color:var(--darkgold);background:var(--surface2)}.mobile-nav b{font-size:18px}.topact .btn.tiny{display:none}.pagehead{align-items:center}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics .metric:last-child:nth-child(odd){grid-column:1/-1}.metric{padding:12px}.metric strong{font-size:20px}}
@media(max-width:510px){.half,.formgrid{grid-template-columns:1fr}.record .formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.record .formgrid .wide{grid-column:1/-1}.filterbar{flex-wrap:wrap}.filterbar select{flex:1}.hero{padding:16px}.greeting .header strong{font-size:15px}}
</style></head><body>
<div class="wrap"><header class="top"><div class="brand"><div class="logo">P.</div><div><b>PERFORMANCE</b><small>KPI WORKSPACE</small></div><span class="tag">FREE</span></div><div class="topact"><button id="undo" class="btn tiny" title="Hoàn tác">↶</button><button id="redo" class="btn tiny" title="Làm lại">↷</button><button id="exportTop" class="btn primary">Sao lưu</button></div></header><div class="layout"><aside class="nav" id="nav"></aside><main id="app" class="content"></main></div></div>
<nav class="mobile-nav" id="mobileNav"></nav><div id="toast" class="toast hidden" role="status"></div><input type="file" id="restoreFile" accept="application/json,.json" class="hidden">
<script>
(function(){
'use strict';
const KEY='perfomance-free-v1',TABS=[['home','⌂','Tổng quan'],['income','↗','Thu tiền'],['ntu','◎','NTU'],['settings','⚙','Cài đặt']];
const defaults=()=>({version:1,month:'Tháng hiện tại',tCOF:31640242,tNON:48535835,tNTU:3,ntuOK:0,wC:.4,wN:.6,profile:{name:'',code:'',role:'',team:''},cust:[],ntu:[]});
let S;try{S=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY))||{});}catch(e){S=defaults()}
if(!Array.isArray(S.cust))S.cust=[];if(!Array.isArray(S.ntu))S.ntu=[];if(!S.profile||typeof S.profile!=='object')S.profile=defaults().profile;
let page='home',history=[],future=[],openRecord='',searchQuery='',kindFilter='all',toastTimeout;
const $=x=>document.querySelector(x),esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>{if(typeof x==='number')return Number.isFinite(x)?x:0;let v=String(x==null?'':x).trim().replace(/[^\d,.-]/g,'');if(v.includes('.')&&v.includes(','))v=v.replace(/\./g,'').replace(',','.');else if(v.includes(','))v=v.replace(',','.');else if((v.match(/\./g)||[]).length>1||/^\d{1,3}(?:\.\d{3})+$/.test(v))v=v.replace(/\./g,'');let k=Number(v);return Number.isFinite(k)?k:0};
const money=x=>Math.round(x||0).toLocaleString('vi-VN')+' đ',pct=(x,d=1)=>(100*(x||0)).toFixed(d).replace('.',',')+'%',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const kinds=['Thu kỳ','Thu quá hạn',...Array.from({length:10},(_,i)=>'Thanh lý B'+(i+3)),'Thanh lý COF','Ngoại lệ'];
const status=r=>num(r.tien)<=0?'Chưa thu':num(r.pos)>0&&num(r.tien)>=num(r.pos)?'Tất toán':num(r.tien)>=num(r.mind)?'Đạt mindue':'Chưa đạt mindue';
function calc(){let cof=0,non=0,ntuPaid=0,ntuPos=0,ntuQual=0;S.cust.forEach(r=>{cof+=num(r.cof);non+=num(r.non)});S.ntu.forEach(r=>{ntuPaid+=num(r.tien);ntuPos+=num(r.pos);if(['Đạt mindue','Tất toán'].includes(status(r)))ntuQual++});let pCof=S.tCOF>0?cof/num(S.tCOF):0,pNon=S.tNON>0?non/num(S.tNON):0,pNtu=S.tNTU>0?num(S.ntuOK)/num(S.tNTU):0;return{cof,non,ntuPaid,ntuPos,ntuQual,pCof,pNon,pNtu,pTien:num(S.wC)*pCof+num(S.wN)*pNon}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){notice('Không thể lưu dữ liệu trên thiết bị');return false}}
function snapshot(){history.push(JSON.stringify(S));if(history.length>60)history.shift();future=[]}
function update(fn){snapshot();fn();save();render()}
function notice(message){const x=$('#toast');x.textContent=message;x.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>x.classList.add('hidden'),2300)}
function heading(sub,title,action=''){return '<div class="pagehead"><div><small>'+sub+'</small><h1>'+title+'</h1></div>'+action+'</div>'}
function stat(name,value,subtitle){return '<div class="card metric"><small>'+name+'</small><strong>'+value+'</strong><em>'+subtitle+'</em></div>'}
function bar(label,v){return '<div class="line"><span>'+label+'</span><b>'+pct(v)+'</b></div><div class="progress"><i style="width:'+Math.max(0,Math.min(100,v*100))+'%"></i></div>'}
function profileGreeting(){let p=S.profile||{},name=String(p.name||'').trim(),code=String(p.code||'').trim(),team=String(p.team||'').trim();let info=(code?'<span>Mã nhân viên: <b>'+esc(code)+'</b></span>':'')+(team?'<span>Team: <b>'+esc(team)+'</b></span>':'');return '<div class="card greeting"><div class="header"><div class="avatar">✦</div><div><small>CHÀO MỪNG TRỞ LẠI</small><strong>Xin chào, '+esc(name||'bạn')+'!</strong></div></div>'+(info?'<div class="meta">'+info+'</div>':'')+'<p>Chúc bạn hoàn thành tốt mục tiêu công việc hôm nay!</p></div>'}
function home(){const v=calc();return profileGreeting()+'<div class="section"><h2>Tổng quan tháng</h2><span>'+esc(S.month)+'</span></div><div class="hero"><small>TỔNG THU COF + NON</small><strong>'+money(v.cof+v.non)+'</strong><div class="tiny">Tiến độ mục tiêu tổng: '+pct(num(S.tCOF)+num(S.tNON)>0?(v.cof+v.non)/(num(S.tCOF)+num(S.tNON)):0)+'</div><div class="progress"><i style="width:'+Math.min(100,100*(num(S.tCOF)+num(S.tNON)>0?(v.cof+v.non)/(num(S.tCOF)+num(S.tNON)):0))+'%"></i></div></div><div class="grid metrics">'+stat('TỔNG COF',money(v.cof),pct(v.pCof)+' mục tiêu')+stat('TỔNG NON',money(v.non),pct(v.pNon)+' mục tiêu')+stat('NTU CIC OK',num(S.ntuOK)+' / '+num(S.tNTU),pct(v.pNtu)+' mục tiêu')+'</div><div class="grid half" style="margin-top:13px"><div class="card"><div class="section" style="margin:0 0 12px"><h2>Tiến độ thu tiền</h2></div>'+bar('COF',v.pCof)+bar('NON',v.pNon)+'<div class="line"><span>Chỉ tiêu COF</span><b>'+money(num(S.tCOF))+'</b></div><div class="line"><span>Chỉ tiêu NON</span><b>'+money(num(S.tNON))+'</b></div></div><div class="card"><div class="section" style="margin:0 0 12px"><h2>NTU</h2></div><div class="line"><span>Hồ sơ đạt mindue</span><b>'+v.ntuQual+' / '+S.ntu.length+'</b></div><div class="line"><span>Tiền thu NTU</span><b>'+money(v.ntuPaid)+'</b></div><div class="line"><span>Target NTU</span><b>'+num(S.tNTU)+'</b></div><div class="line"><span>NTU CIC OK</span><b>'+num(S.ntuOK)+'</b></div></div></div><div class="notice">Bản Free tập trung theo dõi kết quả thu tiền và hồ sơ NTU. Các tính năng nâng cao đã được lược bỏ.</div>'}
function options(vals,selected){return vals.map(v=>'<option value="'+esc(v)+'"'+(v===selected?' selected':'')+'>'+esc(v)+'</option>').join('')}
function recordIncome(r,i){let id=esc(r.id||''),name=r.n||'Khách hàng chưa có tên';let shown=(!searchQuery||(String(r.n||'')+' '+String(r.k||'')).toLowerCase().includes(searchQuery))&&(kindFilter==='all'||r.k===kindFilter);if(!shown)return'';return '<details class="record" data-record="'+id+'"'+(openRecord===r.id?' open':'')+'><summary><div style="min-width:0;flex:1"><span class="name">'+esc(name)+'</span><span class="subtitle">'+esc(r.k||'Thu kỳ')+' · COF '+money(num(r.cof))+'</span></div><span class="money">'+money(num(r.cof)+num(r.non))+'</span><span class="chev">⌄</span></summary><div class="inner"><label class="field">Tên khách hàng<input data-list="cust" data-i="'+i+'" data-field="n" value="'+esc(r.n)+'"></label><label class="field">Loại thu<select data-list="cust" data-i="'+i+'" data-field="k">'+options(kinds,r.k)+'</select></label><div class="formgrid"><label class="field">COF (đ)<input data-list="cust" data-i="'+i+'" data-field="cof" inputmode="numeric" value="'+esc(r.cof)+'"></label><label class="field">NON (đ)<input data-list="cust" data-i="'+i+'" data-field="non" inputmode="numeric" value="'+esc(r.non)+'"></label></div><div class="line"><span>Tổng thu khoản này</span><b>'+money(num(r.cof)+num(r.non))+'</b></div><div class="buttons"><button type="button" class="btn danger" data-delete="cust" data-i="'+i+'">Xóa khoản thu</button></div></div></details>'}
function income(){let v=calc();return heading('COLLECTION DESK','Thu tiền','<button class="btn primary" id="addCust">+ Thêm thu</button>')+'<div class="grid metrics">'+stat('COF',money(v.cof),pct(v.pCof)+' mục tiêu')+stat('NON',money(v.non),pct(v.pNon)+' mục tiêu')+stat('TỔNG ĐÃ THU',money(v.cof+v.non),S.cust.length+' khoản')+'</div><div class="section"><h2>Danh sách thu tiền</h2><span>'+S.cust.length+' khoản</span></div><div class="filterbar"><input class="search" id="search" placeholder="Tìm tên khách hàng hoặc loại thu" value="'+esc(searchQuery)+'"><select id="filterKind"><option value="all">Tất cả loại thu</option>'+options(kinds,kindFilter)+'</select></div><div class="records">'+(S.cust.map(recordIncome).join('')||'<div class="empty">Không có khoản thu phù hợp.</div>')+'</div>'}
function recordNtu(r,i){let id=esc(r.id||''),st=status(r),ok=st==='Đạt mindue'||st==='Tất toán';let shown=(!searchQuery||(String(r.hd||'')+' '+String(r.n||'')).toLowerCase().includes(searchQuery))&&(kindFilter==='all'||(kindFilter==='ok'?ok:!ok));if(!shown)return'';return '<details class="record" data-record="'+id+'"'+(openRecord===r.id?' open':'')+'><summary><div style="min-width:0;flex:1"><span class="name">'+esc(r.n||'(Chưa có tên)')+'</span><span class="subtitle">HĐ '+esc(r.hd||'—')+'</span></div><span><span class="money" style="display:block">'+money(num(r.tien))+'</span><span class="statpill '+(ok?'':'pending')+'">'+st+'</span></span><span class="chev">⌄</span></summary><div class="inner"><div class="formgrid"><label class="field wide">Số hợp đồng<input data-list="ntu" data-i="'+i+'" data-field="hd" value="'+esc(r.hd)+'"></label><label class="field wide">Khách hàng<input data-list="ntu" data-i="'+i+'" data-field="n" value="'+esc(r.n)+'"></label><label class="field">Tiền thu (đ)<input data-list="ntu" data-i="'+i+'" data-field="tien" inputmode="numeric" value="'+esc(r.tien)+'"></label><label class="field">Mindue (đ)<input data-list="ntu" data-i="'+i+'" data-field="mind" inputmode="numeric" value="'+esc(r.mind)+'"></label><label class="field">POS hồ sơ (gốc)<input data-list="ntu" data-i="'+i+'" data-field="pos" inputmode="numeric" value="'+esc(r.pos)+'"></label></div><div class="line"><span>Trạng thái</span><b>'+st+'</b></div><div class="buttons"><button type="button" class="btn danger" data-delete="ntu" data-i="'+i+'">Xóa hồ sơ</button></div></div></details>'}
function ntu(){let v=calc();return heading('NTU PIPELINE','Hồ sơ NTU','<button class="btn primary" id="addNtu">+ Thêm hồ sơ</button>')+'<div class="grid metrics">'+stat('HỒ SƠ NTU',S.ntu.length+' hồ sơ','Tổng hồ sơ')+stat('ĐẠT MINDUE',v.ntuQual+' hồ sơ','Theo tiền thu và mindue')+stat('TIỀN THU NTU',money(v.ntuPaid),'Tổng tiền thu')+'</div><div class="section"><h2>Danh sách hồ sơ</h2><span>'+S.ntu.length+' hồ sơ</span></div><div class="filterbar"><input id="search" class="search" placeholder="Tìm khách hàng hoặc số HĐ" value="'+esc(searchQuery)+'"><select id="filterKind"><option value="all">Tất cả</option><option value="ok"'+(kindFilter==='ok'?' selected':'')+'>Đạt mindue</option><option value="low"'+(kindFilter==='low'?' selected':'')+'>Chưa đạt</option></select></div><div class="records">'+(S.ntu.map(recordNtu).join('')||'<div class="empty">Không có hồ sơ phù hợp.</div>')+'</div><div class="notice">POS hồ sơ là giá trị gốc của hồ sơ NTU, không phải khoản thu quy đổi. Bản Free chỉ theo dõi trạng thái đạt mindue.</div>'}
function field(k,label,v,type='text'){return '<label class="field">'+label+'<input id="set-'+k+'" inputmode="'+(type==='text'?'text':'numeric')+'" value="'+esc(v)+'"></label>'}
function settings(){let p=S.profile||{};return heading('WORKSPACE SETTINGS','Cài đặt')+'<div class="card"><div class="section" style="margin-top:0"><h2>Hồ sơ cá nhân</h2><span>Lưu trên thiết bị</span></div><div class="formgrid">'+field('name','Họ và tên',p.name||'')+field('code','Mã nhân viên',p.code||'')+field('role','Chức danh',p.role||'')+field('team','Team',p.team||'')+'</div><div class="section"><h2>Chỉ tiêu tháng</h2></div><div class="formgrid">'+field('month','Tên tháng',S.month)+field('tCOF','Target COF (đ)',S.tCOF,'numeric')+field('tNON','Target NON (đ)',S.tNON,'numeric')+field('tNTU','Target NTU (bộ)',S.tNTU,'numeric')+field('ntuOK','NTU CIC OK (bộ)',S.ntuOK,'numeric')+'</div><div class="formactions"><button class="btn primary" id="saveSettings">Lưu và cập nhật Tổng quan</button></div></div><div class="section"><h2>Dữ liệu</h2></div><div class="card"><p class="muted" style="font-size:12px;margin-top:0">Dữ liệu chỉ lưu trên thiết bị này. Hãy sao lưu định kỳ. Không có chức năng đồng bộ hoặc sao lưu lên máy chủ.</p><div class="formactions"><button class="btn" id="export">Tải bản sao lưu JSON</button><button class="btn" id="import">Nhập bản sao lưu</button><button class="btn danger" id="reset">Đặt lại dữ liệu</button></div></div><div class="notice">Phiên bản Free sử dụng mô hình dữ liệu riêng, không tự nhập dữ liệu từ HANT trả phí.</div>'}
function render(){const menus=TABS.map(x=>'<button data-page="'+x[0]+'" class="'+(page===x[0]?'active':'')+'">'+x[1]+'　'+x[2]+'</button>').join('');$('#nav').innerHTML=menus;$('#mobileNav').innerHTML=TABS.map(x=>'<button data-page="'+x[0]+'" class="'+(page===x[0]?'active':'')+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('');$('#app').innerHTML=page==='home'?home():page==='income'?income():page==='ntu'?ntu():settings();$('#undo').disabled=!history.length;$('#redo').disabled=!future.length}
function go(to){page=to;openRecord='';searchQuery='';kindFilter='all';location.hash='#'+to;render();window.scrollTo(0,0)}
function settingsSave(){let p={};for(const x of ['name','code','role','team'])p[x]=$('#set-'+x).value.trim();let v={month:$('#set-month').value.trim()||'Tháng hiện tại'};for(const k of ['tCOF','tNON','tNTU','ntuOK']){let z=num($('#set-'+k).value);if(z<0){notice('Chỉ tiêu không thể âm');return}v[k]=z}update(()=>{S.profile=p;Object.assign(S,v)});notice('Đã lưu. Tổng quan đã được cập nhật')}
function exportData(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.href=url;a.download='perfomance-free-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);notice('Đã tạo bản sao lưu')}
function importData(file){if(!file||file.size>5e6){notice('File không hợp lệ hoặc quá lớn');return}const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.version!==1||!Array.isArray(obj.cust)||!Array.isArray(obj.ntu)||!obj.profile)throw Error();const clean=defaults();for(const key of ['month','tCOF','tNON','tNTU','ntuOK'])if(obj[key]!=null)clean[key]=obj[key];clean.profile={...clean.profile,...obj.profile};clean.cust=obj.cust.map(r=>({id:uid(),n:String(r.n||''),k:kinds.includes(r.k)?r.k:'Thu kỳ',cof:num(r.cof),non:num(r.non)}));clean.ntu=obj.ntu.map(r=>({id:uid(),hd:String(r.hd||''),n:String(r.n||''),pos:num(r.pos),mind:num(r.mind),tien:num(r.tien)}));update(()=>{S=clean});notice('Đã khôi phục dữ liệu')}catch(e){notice('Chỉ hỗ trợ file sao lưu của Perfomance Free')}};reader.readAsText(file)}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.page){go(t.dataset.page);return}
if(t.id==='addCust'){let id=uid();update(()=>S.cust.unshift({id,n:'',k:'Thu kỳ',cof:0,non:0}));openRecord=id;render();return}
if(t.id==='addNtu'){let id=uid();update(()=>S.ntu.unshift({id,hd:'',n:'',pos:0,mind:0,tien:0}));openRecord=id;render();return}
if(t.dataset.delete){let type=t.dataset.delete,i=Number(t.dataset.i);if(confirm('Xóa mục này?'))update(()=>S[type].splice(i,1));return}
if(t.id==='saveSettings'){settingsSave();return}
if(t.id==='undo'&&history.length){future.push(JSON.stringify(S));S=JSON.parse(history.pop());save();render();return}
if(t.id==='redo'&&future.length){history.push(JSON.stringify(S));S=JSON.parse(future.pop());save();render();return}
if(t.id==='export'||t.id==='exportTop'){exportData();return}
if(t.id==='import'){$('#restoreFile').click();return}
if(t.id==='reset'&&confirm('Xóa toàn bộ dữ liệu của Perfomance Free trên thiết bị này?')){update(()=>{S=defaults()});notice('Đã đặt lại dữ liệu');return}
});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='restoreFile'){importData(t.files[0]);t.value='';return}if(t.id==='filterKind'){kindFilter=t.value;render();return}if(t.dataset.list){let arr=S[t.dataset.list],i=Number(t.dataset.i),key=t.dataset.field;if(!arr||!arr[i])return;const val=['n','hd','k'].includes(key)?t.value:Math.max(0,num(t.value));const detail=t.closest('[data-record]');openRecord=detail?detail.dataset.record:'';update(()=>{arr[i][key]=val});return}});
document.addEventListener('input',e=>{if(e.target.id==='search'){searchQuery=e.target.value.toLowerCase().trim();const list=page==='income'?S.cust:S.ntu;document.querySelectorAll('[data-record]').forEach(el=>{let r=list.find(x=>x.id===el.dataset.record);el.hidden=!!searchQuery&&!String(page==='income'?(r.n+' '+r.k):(r.hd+' '+r.n)).toLowerCase().includes(searchQuery)})}});
window.addEventListener('hashchange',()=>{let to=location.hash.slice(1);if(TABS.some(x=>x[0]===to)&&to!==page){page=to;openRecord='';searchQuery='';kindFilter='all';render()}});
const initial=location.hash.slice(1);if(TABS.some(x=>x[0]===initial))page=initial;render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
